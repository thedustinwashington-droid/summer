<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer Parenting Scheduler</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>Summer Parenting Scheduler</h1>
      <button id="logoutBtn" class="ghost hidden" type="button">Log out</button>
    </header>

    <section id="entryView" class="panel centered">
      <h2>Start</h2>
      <p class="muted">Draft, save, and share summer parenting-time calendars.</p>
      <div class="entry-actions">
        <button id="startLogin" type="button">Login</button>
        <button id="startSignup" class="secondary" type="button">Create Account</button>
      </div>
    </section>

    <section id="authView" class="panel hidden">
      <button id="backToStart" type="button" class="ghost">← Back</button>

      <form id="loginForm" class="form-grid hidden">
        <h2>Welcome back</h2>
        <label>
          Account number
          <input name="accountNumber" autocomplete="username" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Log in</button>
      </form>

      <form id="signupForm" class="form-grid hidden">
        <h2>Create your profile</h2>
        <label>
          Name
          <input name="name" required />
        </label>
        <label>
          Role
          <select name="role" required>
            <option value="Father">Father</option>
            <option value="Mother">Mother</option>
            <option value="Attorney">Attorney</option>
          </select>
        </label>
        <label>
          Custody
          <select name="custody" required>
            <option value="Custodial">Custodial</option>
            <option value="Non-custodial">Non-custodial</option>
          </select>
        </label>
        <label>
          State
          <select name="state" required>
            <option value="Indiana">Indiana</option>
          </select>
        </label>
        <label>
          Password
          <input name="password" type="password" minlength="4" autocomplete="new-password" required />
        </label>
        <button type="submit">Create account</button>
      </form>
      <p id="authMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="plannerView" class="hidden">
      <div class="layout">
        <aside class="panel sidebar">
          <div class="sidebar-header">
            <h2>Saved Calendars</h2>
            <button id="newCalendarBtn" type="button" class="secondary">New</button>
          </div>
          <ul id="savedCalendarList" class="saved-list"></ul>
        </aside>

        <section class="panel planner-panel">
          <form id="plannerForm" class="form-grid two-col">
            <h2 id="plannerTitle">Planner</h2>
            <label>
              Calendar title
              <input name="title" required />
            </label>
            <label>
              Last day of school
              <input name="schoolEnd" type="date" required />
            </label>
            <label>
              First day next school year
              <input name="schoolStart" type="date" required />
            </label>
            <label>
              Parenting split
              <select name="split" required>
                <option value="alternating-weekends">Alternating weekends</option>
                <option value="every-other-week">Every other week</option>
                <option value="2-2-3">2-2-3 rotation</option>
                <option value="custom">Custom day-by-day</option>
              </select>
            </label>
            <label>
              Parent 1 name
              <input name="parent1" required />
            </label>
            <label>
              Parent 2 name
              <input name="parent2" required />
            </label>
            <label>
              Parent 1 color
              <input name="color1" type="color" required />
            </label>
            <label>
              Parent 2 color
              <input name="color2" type="color" required />
            </label>

            <div class="holiday-group">
              <label for="holidayToggle">Indiana holiday overrides</label>
              <button id="holidayToggle" type="button" class="secondary full">Select holidays ▾</button>
              <div id="holidayDropdown" class="holiday-dropdown hidden" role="group" aria-label="Indiana holiday selector">
                <label><input type="checkbox" value="memorial-day" /> Memorial Day</label>
                <label><input type="checkbox" value="independence-day" /> Independence Day</label>
                <label><input type="checkbox" value="labor-day" /> Labor Day</label>
              </div>
            </div>

            <label>
              Override holidays to
              <select name="holidayOwner" required>
                <option value="parent1">Parent 1</option>
                <option value="parent2">Parent 2</option>
              </select>
            </label>

            <div class="actions">
              <button id="generateBtn" type="submit">Generate</button>
              <button id="saveBtn" type="button" class="secondary">Save</button>
              <button id="downloadBtn" type="button" class="secondary">Download</button>
              <button id="printBtn" type="button" class="secondary">Print</button>
              <button id="emailBtn" type="button" class="secondary">Email</button>
              <button id="shareBtn" type="button" class="secondary">Share Link</button>
            </div>
          </form>

          <div class="calendar-wrap">
            <div id="overnightTotals" class="totals muted">Overnights will appear after generation.</div>
            <h3>Calendar Preview</h3>
            <div id="calendarOutput" class="calendar-output"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
